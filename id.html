<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaswI ID</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --ok: #16a34a;
    --ok-bg: #ecfdf5;
    --err: #dc2626;
    --err-bg: #fef2f2;
    --warn: #d97706;
    --warn-bg: #fffbeb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --line: #262b36;
      --ok: #4ade80;
      --ok-bg: #10241a;
      --err: #f87171;
      --err-bg: #2a1416;
      --warn: #fbbf24;
      --warn-bg: #2a2010;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px rgba(16, 24, 40, .06);
  }
  .badge {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 600;
    line-height: 1;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  p {
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--muted);
  }
  .foot {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .02em;
  }
  [data-state="success"] .badge { background: var(--ok-bg); color: var(--ok); }
  [data-state="error"] .badge { background: var(--err-bg); color: var(--err); }
  [data-state="warn"] .badge { background: var(--warn-bg); color: var(--warn); }
</style>
</head>
<body>
  <main class="card" id="card" data-state="success">
    <div class="badge" id="icon">✓</div>
    <h1 id="title">登录成功</h1>
    <p id="desc">可以关闭此页面，返回 LaswI 继续。</p>
    <div class="foot">LaswI ID</div>
  </main>

<script>
  // 状态由查询参数决定，便于静态托管时直接预览各态：
  //   ?status=success | error | warn | expired
  const STATES = {
    success: { icon: "✓", title: "登录成功", desc: "可以关闭此页面，返回 LaswI 继续。", kind: "success" },
    fail:    { icon: "✕", title: "登录未完成", desc: "授权没有走完，请回到 LaswI 重新发起登录。", kind: "error" },
    state:   { icon: "!", title: "登录校验失败", desc: "本次登录请求无法确认来源，请重新发起登录。", kind: "error" },
    token:   { icon: "!", title: "登录凭据缺失", desc: "没有拿到访问凭据，请重新发起登录。", kind: "warn" },
    expired: { icon: "⏱", title: "登录已过期", desc: "本次登录等待超时，请回到 LaswI 重新发起。", kind: "warn" }
  };

  const key = new URLSearchParams(location.search).get("status") || "success";
  const view = STATES[key] || STATES.success;

  document.getElementById("card").dataset.state = view.kind;
  document.getElementById("icon").textContent = view.icon;
  document.getElementById("title").textContent = view.title;
  document.getElementById("desc").textContent = view.desc;
</script>
</body>
</html>
